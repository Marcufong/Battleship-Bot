[project]
name = "battleship-bot"
version = "0.1.0"
description = "battleship bot! see README.me for details"
readme = "README.md"
authors = [
    { name = "Marcus Fong", email = "fongmarcus2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cupy-cuda13x==14.2.0",
    "numpy==2.5.2",
    "torch==2.13.0",
]

[project.scripts]
battleship-bot = "battleship_bot:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
